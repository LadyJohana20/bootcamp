<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../scss/main.css">
    <title>Alta de Productos | Carpas El Fuerte</title>
</head>
<body>
    <header id="mainheader">
        <nav id="navbar">
            <div class="container">
                <div class="logo">
                    <img src="../imagenes/logo.png" alt="Logo Carpas El Fuerte">
                </div>
                <ul class="nav-links">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./nosotros.html">Nosotros</a></li>
                    <li><a href="./alta.html">Productos</a></li>
                    <li><a href="./contacto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
        <div id="showcase">
            <div class="container">
                <h1 class="display-1">Alta de Productos</h1>
                <p>Agrega nuevos productos a tu catálogo completando el siguiente formulario.</p>
            </div>
        </div>
    </header>

    <section id="product-form">
        <div class="container">
            <h2>Formulario de producto</h2>

            <div style="margin-bottom: 20px; display:flex; gap:8px; align-items:center;">
                <input id="searchInput" type="search" placeholder="Buscar producto por nombre" class="form-group-control" style="flex:1;">
                <button id="searchBtn" class="btn btn-dark">Buscar</button>
            </div>

            <form id="productForm" action="#" novalidate enctype="multipart/form-data">
                

                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input id="nombre" name="nombre" type="text" class="form-group-control" required>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="precio">Precio (ARS) *</label>
                    <input id="precio" name="precio" type="text" class="form-group-control" required placeholder="e.j. 1250.00">
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="stock">Stock *</label>
                    <input id="stock" name="stock" type="number" class="form-group-control" min="0" required>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="marca">Marca *</label>
                    <input id="marca" name="marca" type="text" class="form-group-control" required>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría *</label>
                    <select id="categoria" name="categoria" class="form-group-control" required>
                        <option value="">-- Selecciona --</option>
                        <option value="carpas">Carpas</option>
                        <option value="parasoles">Parasoles</option>
                        <option value="lonas">Lonas</option>
                        <option value="accesorios">Accesorios</option>
                    </select>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="descCorta">Descripción corta *</label>
                    <input id="descCorta" name="descCorta" type="text" class="form-group-control" required>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="descLarga">Descripción larga *</label>
                    <textarea id="descLarga" name="descLarga" cols="30" rows="6" class="form-group-control" required></textarea>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="form-group" style="display:flex; gap:12px; align-items:center;">
                    <label for="envio">Envío sin cargo</label>
                    <input id="envio" name="envio" type="checkbox">
                </div>

                <div style="display:flex; gap:12px;">
                    <div class="form-group" style="flex:1;">
                        <label for="edadDesde">Edad desde (años)</label>
                        <input id="edadDesde" name="edadDesde" type="number" class="form-group-control" min="0" max="120">
                        <div class="error" aria-live="polite"></div>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label for="edadHasta">Edad hasta (años)</label>
                        <input id="edadHasta" name="edadHasta" type="number" class="form-group-control" min="0" max="120">
                        <div class="error" aria-live="polite"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="foto">Foto (jpg, png, gif, webp, avif) - máx 2MB</label>
                    <input id="foto" name="foto" type="file" accept="image/*" class="form-group-control">
                    <div class="error" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn btn-dark">Guardar producto</button>
                <div id="formProductMessage" role="status" aria-live="polite" style="margin-top:10px;"></div>
            </form>

        </div>
    </section>

    <div class="container">
        <footer id="mainfooter">
            <p>&copy; 2025 Carpas El Fuerte. Todos los derechos reservados.</p>
            <p>&copy; Elaborado por Lady Johana Caicedo Cardozo.</p>
        </footer>
    </div>

    <script src="../js/alta.js"></script>
</body>
</html>
